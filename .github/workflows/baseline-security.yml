name: Baseline Security Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  baseline-security:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: read
      issues: read

    steps:
      # =========================
      # 1. CHECKOUT REPOSITORY
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # 2. SETUP PYTHON
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # =========================
      # 3. INSTALL PYTHON DEPENDENCIES
      # =========================
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip

      # =========================
      # 4. SAST - SONARCLOUD
      # =========================
      - name: Run SAST (SonarCloud)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify sonar:sonar \
          -Dsonar.projectKey=mickey-maker_spring-petclinic \
          -Dsonar.organization=mickey-maker \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Export SAST JSON from SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mkdir -p astf-python/data
          curl -s -u $SONAR_TOKEN: \
          "https://sonarcloud.io/api/issues/search?componentKeys=mickey-maker_spring-petclinic&types=VULNERABILITY,BUG,CODE_SMELL&ps=500" \
          -o astf-python/data/sast.json

      # =========================
      # 5. START SPRING BOOT APP
      # =========================
      - name: Start Spring Boot App
        run: |
          nohup mvn spring-boot:run > app.log 2>&1 &
          sleep 60

      # =========================
      # 6. WAIT FOR APP TO BE READY
      # =========================
      - name: Wait for Spring Boot
        run: |
          echo "Waiting for Spring Boot to be ready..."
          for i in {1..20}; do
            curl -s http://127.0.0.1:8080 && break
            echo "Still waiting..."
            sleep 5
          done

      # =========================
      # 7. DAST - OWASP ZAP
      # =========================
      - name: Prepare DAST Output Folder
        run: |
          mkdir -p astf-python/data
          chmod -R 777 astf-python/data

      - name: Run DAST (OWASP ZAP)
        run: |
          docker run --rm --network=host \
            -u root \
            -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t http://127.0.0.1:8080 \
            -J /zap/wrk/astf-python/data/dast.json \
            -r /zap/wrk/astf-python/data/zap-report.html || true

      # =========================
      # 8. SCA - SNYK
      # =========================
      - name: Run SCA (Snyk CLI)
        run: |
          npm install -g snyk
          snyk auth ${{ secrets.SNYK_TOKEN }}
          snyk test --json > sca.json || true

      - name: Move SCA Result
        run: |
          mkdir -p astf-python/data
          mv sca.json astf-python/data/sca.json || echo '{}' > astf-python/data/sca.json

      # =========================
      # 9. PREPARE BASELINE OUTPUT
      # =========================
      - name: Prepare Baseline Output Folder
        run: |
          mkdir -p astf-python/output

      # =========================
      # 10. GENERATE BASELINE CSV
      # =========================
      - name: Generate Baseline Alerts CSV
        run: |
          python astf-python/baseline_generator.py

      # =========================
      # 11. DEBUG BASELINE OUTPUT
      # =========================
      - name: Debug Baseline Output
        run: |
          echo "=== Baseline Output Folder ==="
          ls -lah astf-python/output || true
          echo "=== CSV Line Count ==="
          wc -l astf-python/output/baseline_alerts.csv || true

      # =========================
      # 12. UPLOAD BASELINE ARTIFACT
      # =========================
      - name: Upload Baseline Artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseline-output
          path: astf-python/output/baseline_alerts.csv

      - name: Print Baseline Artifact Download URL
        run: |
          echo "Artifact baseline-output has been successfully uploaded!"
          echo "Artifact download URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"

