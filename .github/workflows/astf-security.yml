name: ASTF Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  astf-security:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1️⃣ CHECKOUT CODE
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # 2️⃣ SETUP JAVA 17
      # =========================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # =========================
      # 3️⃣ CACHE MAVEN + SONAR
      # =========================
      - name: Cache SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      # =========================
      # 4️⃣ SAST — SONARCLOUD ✅ (FIXED)
      # =========================
      - name: Run SAST (SonarCloud)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify sonar:sonar \
          -Dsonar.projectKey=mickey-maker_spring-petclinic \
          -Dsonar.organization=mickey-maker \
          -Dsonar.host.url=https://sonarcloud.io

      # =========================
      # 5️⃣ SCA — SNYK ✅
      # =========================
      - name: Install Snyk
        run: npm install -g snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth $SNYK_TOKEN

      - name: Run SCA (Snyk)
        run: snyk test --json > astf-python/data/sca.json || true

      # =========================
      # 6️⃣ DAST — OWASP ZAP ✅ (DOCKER SAFE MODE)
      # =========================
      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run -t owasp/zap2docker-stable \
            zap-baseline.py -t http://example.com -J dast.json || true
          
          mv dast.json astf-python/data/dast.json

      # =========================
      # 7️⃣ SETUP PYTHON ✅
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install pandas numpy scikit-learn matplotlib seaborn

      # =========================
      # 8️⃣ JSON MERGE ✅
      # =========================
      - name: Merge SAST + DAST + SCA
        run: python astf-python/json_combiner.py

      # =========================
      # 9️⃣ ASTF TRIAGE + METRICS ✅
      # =========================
      - name: Run ASTF Engine
        run: python astf-python/astf_engine.py

      # =========================
      # 🔟 ARCHIVE THESIS RESULTS ✅
      # =========================
      - name: Upload ASTF Outputs
        uses: actions/upload-artifact@v4
        with:
          name: astf-results
          path: astf-python/output/
