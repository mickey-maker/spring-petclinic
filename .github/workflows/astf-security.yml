name: ASTF Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  astf-security:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # ✅ 1. CHECKOUT CODE
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # ✅ 2. SETUP JAVA 17 (SAST)
      # =========================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # =========================
      # ✅ 3. SAST - SONARCLOUD (SCAN)
      # =========================
      - name: Run SAST (SonarCloud)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify sonar:sonar \
          -Dsonar.projectKey=mickey-maker_spring-petclinic \
          -Dsonar.organization=mickey-maker \
          -Dsonar.host.url=https://sonarcloud.io

      # =========================
      # ✅ 3B. EXPORT SAST.JSON ✅✅✅ (THIS WAS MISSING)
      # =========================
      - name: Export SAST JSON from SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mkdir -p astf-python/data
          curl -s -u $SONAR_TOKEN: \
          "https://sonarcloud.io/api/issues/search?componentKeys=mickey-maker_spring-petclinic&types=VULNERABILITY,BUG,CODE_SMELL&ps=500" \
          -o astf-python/data/sast.json

      # =========================
      # ✅ 4. SCA - SNYK
      # =========================
      - name: Install Snyk
        run: npm install -g snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth $SNYK_TOKEN

      - name: Run SCA (Snyk)
        run: |
          mkdir -p astf-python/data
          snyk test --json > astf-python/data/sca.json || echo "{}" > astf-python/data/sca.json

      # =========================
      # ✅ 5. DAST - OWASP ZAP (SAFE MODE ✅✅✅)
      # =========================
      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://example.com -J zap_report.json || true

          mkdir -p astf-python/data
          cp zap_report.json astf-python/data/dast.json || echo "{}" > astf-python/data/dast.json

      # =========================
      # ✅ 6. SETUP PYTHON
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install pandas numpy

      # =========================
      # ✅ 7. JSON MERGE ✅✅✅
      # =========================
      - name: Merge SAST + DAST + SCA
        run: python astf-python/json_combiner.py

      # =========================
      # ✅ 8. ASTF TRIAGE + METRICS ✅✅✅
      # =========================
      - name: Run ASTF Engine
        run: python astf-python/astf_engine.py

      # =========================
      # ✅ 9. UPLOAD FINAL RESULTS ✅ (NO ARTIFACT BUG)
      # =========================
      - name: Upload ASTF Results
        uses: actions/upload-artifact@v4
        with:
          name: astf-results-final
          path: |
            astf-python/output/
            astf-python/combined_astf.json
