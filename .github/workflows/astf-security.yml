name: ASTF Security Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  astf-security:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1️⃣ CHECKOUT CODE
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # 2️⃣ SETUP JAVA
      # =========================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # =========================
      # 3️⃣ SAST - SONARQUBE
      # =========================
      - name: Run SAST (SonarQube)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify sonar:sonar

      # =========================
      # 4️⃣ SCA - SNYK
      # =========================
      - name: Install Snyk
        run: npm install -g snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth $SNYK_TOKEN

      - name: Run SCA (Snyk)
        run: snyk test --json > astf-python/data/sca.json || true

      # =========================
      # 5️⃣ DAST - OWASP ZAP
      # =========================
      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run -t owasp/zap2docker-stable \
            zap-baseline.py -t http://localhost:8080 -J dast.json || true
          
          mv dast.json astf-python/data/dast.json

      # =========================
      # 6️⃣ SETUP PYTHON
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install pandas

      # =========================
      # 7️⃣ JSON MERGE
      # =========================
      - name: Merge SAST + DAST + SCA
        run: python astf-python/json_combiner.py

      # =========================
      # 8️⃣ ASTF PYTHON TRIAGE + METRICS
      # =========================
      - name: Run ASTF Engine
        run: python astf-python/astf_engine.py

      # =========================
      # 9️⃣ ARCHIVE RESULTS
      # =========================
      - name: Upload ASTF Outputs
        uses: actions/upload-artifact@v4
        with:
          name: astf-results
          path: astf-python/output/
