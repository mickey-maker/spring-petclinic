name: ASTF Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  astf-security:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1️⃣ CHECKOUT CODE
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # 2️⃣ SETUP JAVA 17
      # =========================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # =========================
      # 3️⃣ CACHE MAVEN + SONAR
      # =========================
      - name: Cache SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      # =========================
      # 4️⃣ SAST — SONARCLOUD ✅
      # =========================
      - name: Run SAST (SonarCloud)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify sonar:sonar \
          -Dsonar.projectKey=mickey-maker_spring-petclinic \
          -Dsonar.organization=mickey-maker \
          -Dsonar.host.url=https://sonarcloud.io

      # =========================
      # 5️⃣ SCA — SNYK ✅
      # =========================
      - name: Install Snyk
        run: npm install -g snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth $SNYK_TOKEN

      - name: Run SCA (Snyk)
        run: snyk test --json > astf-python/data/sca.json || true

      # =========================
      # 6️⃣ START SPRING BOOT ✅
      # =========================
      - name: Start Spring Boot App
        run: |
          nohup mvn spring-boot:run > app.log 2>&1 &
          sleep 25

      # =========================
      # 7️⃣ DAST — OWASP ZAP ✅✅✅
      # =========================
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'http://example.com'
          fail_action: false
          allow_issue_writing: false
          cmd_options: '-J dast.json'
          artifact_name: 'disable'

      - name: Move DAST output into ASTF data folder
        run: mv dast.json astf-python/data/dast.json

      # =========================
      # 8️⃣ SETUP PYTHON ✅
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install pandas numpy scikit-learn matplotlib seaborn

      # =========================
      # 9️⃣ JSON MERGE ✅
      # =========================
      - name: Merge SAST + DAST + SCA
        run: python astf-python/json_combiner.py

      # =========================
      # 🔟 ASTF TRIAGE + METRICS ✅
      # =========================
      - name: Run ASTF Engine
        run: python astf-python/astf_engine.py

      # =========================
      # 1️⃣1️⃣ ARCHIVE THESIS RESULTS ✅
      # =========================
      - name: Upload ASTF Outputs
        uses: actions/upload-artifact@v4
        with:
          name: astf-results
          path:
            astf-python/output/
            astf-python/combined_astf.json
