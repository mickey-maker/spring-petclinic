name: ASTF Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  astf-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
      issues: read

    steps:

      # =========================
      # ✅ 1. CHECKOUT CODE
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # ✅ 2. SETUP JAVA 17 (SAST)
      # =========================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # =========================
      # ✅ 3. RUN SAST (SONARCLOUD)
      # =========================
      - name: Run SAST (SonarCloud)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify sonar:sonar \
          -Dsonar.projectKey=mickey-maker_spring-petclinic \
          -Dsonar.organization=mickey-maker \
          -Dsonar.host.url=https://sonarcloud.io

      # =========================
      # ✅ 4. EXPORT SAST.JSON
      # =========================
      - name: Export SAST JSON from SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mkdir -p astf-python/data
          curl -s -u $SONAR_TOKEN: \
          "https://sonarcloud.io/api/issues/search?componentKeys=mickey-maker_spring-petclinic&types=BUG,VULNERABILITY,CODE_SMELL&ps=500" \
          > astf-python/data/sast.json

      # =========================
      # ✅ 5. RUN SCA (SNYK)
      # =========================
      - name: Install Snyk
        run: npm install -g snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth $SNYK_TOKEN

      - name: Run Snyk Scan
        run: |
          mkdir -p astf-python/data
          snyk test --json > astf-python/data/sca_raw.json || true

      # =========================
      # ✅ 6. EXPORT DEPENDABOT → sca.json
      # =========================
      - name: Export Dependabot Alerts as SCA JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/mickey-maker/spring-petclinic/dependabot/alerts" \
          > astf-python/data/sca.json

      # =========================
      # ✅ 7. RUN DAST (ZAP → GITHUB ISSUES)
      # =========================
      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'http://example.com'
          fail_action: false

      # =========================
      # ✅ 8. EXPORT ZAP ISSUES → dast.json
      # =========================
      - name: Export ZAP Issues as DAST JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p astf-python/data
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/mickey-maker/spring-petclinic/issues?state=open" \
          > astf-python/data/dast.json

      # =========================
      # ✅ 9. SETUP PYTHON
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install pandas numpy

      # =========================
      # ✅ 🔟 JSON MERGE
      # =========================
      - name: Merge SAST + DAST + SCA
        run: python astf-python/json_combiner.py

      # =========================
      # ✅ 1️⃣1️⃣ ASTF TRIAGE + METRICS
      # =========================
      - name: Run ASTF Engine
        run: python astf-python/astf_engine.py

      # =========================
      # ✅ 1️⃣2️⃣ UPLOAD FINAL THESIS RESULTS
      # =========================
      - name: Upload ASTF Results
        uses: actions/upload-artifact@v4
        with:
          name: astf-results-final
          path: |
            astf-python/output/
            astf-python/combined_astf.json
