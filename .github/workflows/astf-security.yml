name: ASTF Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  astf-security:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # ✅ 1. CHECKOUT CODE
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # ✅ 2. SETUP JAVA 17 (SAST)
      # =========================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # =========================
      # ✅ 3. SAST - SONARCLOUD
      # =========================
      - name: Run SAST (SonarCloud)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify sonar:sonar \
          -Dsonar.projectKey=mickey-maker_spring-petclinic \
          -Dsonar.organization=mickey-maker \
          -Dsonar.host.url=https://sonarcloud.io

      # =========================
      # ✅ 4. SCA - SNYK
      # =========================
      - name: Install Snyk
        run: npm install -g snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth $SNYK_TOKEN

      - name: Run SCA (Snyk)
        run: |
          snyk test --json > astf-python/data/sca.json || echo "{}" > astf-python/data/sca.json

      # =========================
      # ✅ 5. DAST - OWASP ZAP
      # =========================
      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'http://example.com'
          format: 'JSON'
          output: 'dast.json'

      - name: Move DAST Output
        run: |
          mv dast.json astf-python/data/dast.json || echo "{}" > astf-python/data/dast.json

      # =========================
      # ✅ 6. SETUP PYTHON
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install pandas numpy

      # =========================
      # ✅ 7. JSON MERGE
      # =========================
      - name: Merge SAST + DAST + SCA
        run: python astf-python/json_combiner.py

      # =========================
      # ✅ 8. ASTF TRIAGE + METRICS
      # =========================
      - name: Run ASTF Engine
        run: python astf-python/astf_engine.py

      # =========================
      # ✅ 9. UPLOAD FINAL RESULTS
      # =========================
      - name: Upload ASTF Results
        uses: actions/upload-artifact@v4
        with:
          name: astf-results
          path: |
            astf-python/output/
            astf-python/combined_astf.json
