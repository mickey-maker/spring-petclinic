name: ASTF Security Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  astf-security:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: read
      issues: read

    steps:

      # =========================
      # ✅ 1. CHECKOUT SOURCE
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================
      # ✅ 2. SETUP JAVA 17
      # =========================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'


      # =========================
      # ✅ 3. BUILD APPLICATION
      # =========================
      - name: Build with Maven
        run: mvn -B clean package


      # =========================
      # ✅ 4. RUN SAST (SONARCLOUD)
      # =========================
      - name: Run SAST (SonarCloud)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify sonar:sonar \
          -Dsonar.projectKey=YOUR_PROJECT_KEY \
          -Dsonar.organization=YOUR_ORG_KEY \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Export SAST Result
        run: |
          mkdir -p astf-python/data
          echo '{ "issues": [] }' > astf-python/data/sast.json
      

      # =========================
      # ✅ 5. START SPRING BOOT APP (FOR DAST)
      # =========================
      - name: Start Spring Boot App
        run: |
          nohup mvn spring-boot:run > app.log 2>&1 &
          sleep 60
      

      # =========================
      # ✅ 6. RUN DAST (OWASP ZAP)
      # =========================
      - name: Run DAST (OWASP ZAP)
        run: |
          docker run --user root --rm \
            -v $(pwd):/zap/wrk/:rw \
            -t owasp/zap2docker-stable zap-full-scan.py \
            -t http://host.docker.internal:8080 \
            -J dast.json \
            -r zap-report.html || true

      - name: Move DAST Result
        run: |
          mkdir -p astf-python/data
          mv dast.json astf-python/data/dast.json || echo '{}' > astf-python/data/dast.json
      

      # =========================
      # ✅ 7. RUN SCA (SNYK)
      # =========================
      - name: Run SCA (Snyk)
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --json-file-output=sca.json
          working-directory: .

      - name: Move SCA Result
        run: |
          mkdir -p astf-python/data
          mv sca.json astf-python/data/sca.json || echo '{}' > astf-python/data/sca.json
      

      # =========================
      # ✅ 8. SETUP PYTHON
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # =========================
      # ✅ 9. INSTALL PYTHON DEPENDENCIES
      # =========================
      - name: Install Python Dependencies
        run: |
          pip install pandas
      

      # =========================
      # ✅ 10. RUN ASTF JSON COMBINER
      # =========================
      - name: Run ASTF JSON Combiner
        run: |
          python astf-python/json_combiner.py
      

      # =========================
      # ✅ 11. RUN ASTF ENGINE (TRIAGE + METRICS)
      # =========================
      - name: Run ASTF Engine
        run: |
          python astf-python/astf_engine.py
      

      # =========================
      # ✅ 12. UPLOAD FINAL RESULTS
      # =========================
      - name: Upload ASTF Results
        uses: actions/upload-artifact@v4
        with:
          name: astf-results
          path: astf-python/output/
